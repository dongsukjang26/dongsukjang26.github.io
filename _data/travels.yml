# Places shown on the travel map (/travel/). Each entry is one pin.
#
# id       unique slug; local photos live in assets/img/travel/<id>/
# name     place name shown on the map
# country  country name (used for the "countries" count)
# lat/lng  coordinates (right-click a spot in Google Maps to copy them)
# date     "YYYY-MM" or "YYYY-MM-DD" (keep the quotes)
# type     ski | tennis | golf | trip (sets the pin color and the filter)
# note     optional one-line memo shown in the popup
# post     optional link to a related blog post, e.g. /blog/2024/my-post/
# photos   list of photos; each one uses either
#            file: name of an image in assets/img/travel/<id>/
#            url:  full URL of an image hosted elsewhere (thumb: optional smaller URL)
#          w/h optional pixel width/height; without them the viewer measures the image first
#          caption optional text shown under the photo

- id: niseko
  name: Niseko
  country: Japan
  lat: 42.8625
  lng: 140.6987
  date: "2024-02"
  type: ski
  note: My first solo ski trip abroad.
  photos:
    - file: niseko-panorama.jpg
      w: 2400
      h: 670
      caption: Mt. Yōtei from the slopes of Niseko, Feb 2024

